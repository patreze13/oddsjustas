<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Patreze Odds Justas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #000000; color: #f1f5f9; padding: 18px; display: flex; flex-direction: column; min-height: 100vh; }
    
    header { text-align: center; margin-bottom: 20px; }
    .logo-header { max-width: 190px; height: auto; display: block; margin: 0 auto; }
    p.subtitle { font-size: 0.78rem; color: #71717a; margin-top: 6px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
    
    .card { background-color: #0d0d11; border-radius: 14px; padding: 18px; margin-bottom: 16px; border: 1px solid #1f1f28; }
    .input-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.88rem; font-weight: 700; color: #e4e4e7; margin-bottom: 3px; }
    span.hint { display: block; font-size: 0.72rem; color: #a1a1aa; margin-bottom: 6px; }
    
    input { 
      width: 100%; 
      background: #000000; 
      border: 1.5px solid #27272a; 
      border-radius: 8px; 
      padding: 12px; 
      color: #FACC15; 
      font-size: 1.2rem; 
      font-weight: 900; 
      outline: none; 
      transition: border-color 0.2s;
    }
    input:focus { border-color: #FACC15; }
    
    button { 
      width: 100%; 
      background: linear-gradient(135deg, #FACC15, #EAB308); 
      color: #000000; 
      border: none; 
      border-radius: 10px; 
      padding: 15px; 
      font-size: 1rem; 
      font-weight: 900; 
      cursor: pointer; 
      text-transform: uppercase; 
      letter-spacing: 0.5px; 
      margin-top: 6px; 
    }
    button:active { transform: scale(0.98); opacity: 0.9; }

    #loading { display: none; text-align: center; padding: 24px 0; }
    .spinner-logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 12px;
      animation: pulsar 0.8s ease-in-out infinite alternate;
    }
    @keyframes pulsar {
      from { transform: scale(0.92); opacity: 0.7; }
      to { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 10px #FACC15); }
    }
    #loading p { font-size: 0.85rem; color: #FACC15; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }

    #resultado { display: none; margin-top: 4px; }
    .res-box { padding: 18px; border-radius: 12px; border: 1.5px solid transparent; }
    .ev-positivo { background-color: rgba(22, 101, 52, 0.2); border-color: #22c55e; }
    .ev-negativo { background-color: rgba(153, 27, 27, 0.2); border-color: #ef4444; }
    
    .res-line { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.90rem; }
    .res-value { font-weight: 900; font-size: 1.15rem; }
    
    .target-box {
      background: #18181b;
      border: 1.5px solid #FACC15;
      border-radius: 10px;
      padding: 12px 14px;
      margin: 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .target-box .target-label { font-size: 0.85rem; font-weight: 700; color: #FACC15; }
    .target-box .target-val { font-size: 1.25rem; font-weight: 900; color: #FFFFFF; }

    .veredito-badge { text-align: center; padding: 12px; border-radius: 8px; font-weight: 900; font-size: 1.05rem; margin-top: 10px; text-transform: uppercase; }
    .badge-pos { background: #15803d; color: #ffffff; }
    .badge-neg { background: #b91c1c; color: #ffffff; }
    .explicacao { font-size: 0.82rem; color: #cbd5e1; margin-top: 12px; line-height: 1.45; }
  </style>
</head>
<body>

  <header>
    <img src="logo.png" alt="Patreze Odds Justas" class="logo-header">
    <p class="subtitle">Calculadora de Precificação Real</p>
  </header>

  <div class="card">
    <div class="input-group">
      <label>1. Sua Odd Escolhida</label>
      <span class="hint">A cotação do seu palpite (Ex: Over 4.5 a 1.70)</span>
      <input type="number" step="0.01" id="oddA" placeholder="1.70" inputmode="decimal">
    </div>

    <div class="input-group">
      <label>2. A Odd Contrária</label>
      <span class="hint">O outro lado desse mesmo mercado (Ex: Under 4.5 a 2.00)</span>
      <input type="number" step="0.01" id="oddB" placeholder="2.00" inputmode="decimal">
    </div>

    <button onclick="iniciarCalculo()">Conferir Bilhete</button>
  </div>

  <div id="loading">
    <img src="logo.png" class="spinner-logo" alt="Calculando">
    <p>Calculando Precificação...</p>
  </div>

  <div id="resultado" class="card"></div>

  <script>
    function iniciarCalculo() {
      const oddA = parseFloat(document.getElementById('oddA').value);
      const oddB = parseFloat(document.getElementById('oddB').value);
      const loading = document.getElementById('loading');
      const resDiv = document.getElementById('resultado');

      if (!oddA || !oddB || oddA <= 1 || oddB <= 1) {
        alert('Digite valores de odds válidos (acima de 1.00)');
        return;
      }

      resDiv.style.display = 'none';
      loading.style.display = 'block';

      setTimeout(() => {
        loading.style.display = 'none';
        executarAnalise(oddA, oddB);
      }, 1000);
    }

    function executarAnalise(oddA, oddB) {
      const resDiv = document.getElementById('resultado');

      const probA = (1 / oddA);
      const probB = (1 / oddB);
      const somaMercado = probA + probB;

      const juice = (somaMercado - 1) * 100;
      const probRealA = probA / somaMercado;
      const oddJusta = 1 / probRealA;

      // Odd ideal para ter margem real de lucro sustentável (+3% a +5% de valor esperado)
      const oddIdealLucro = oddJusta * 1.04; 

      const ehLucrativo = oddA >= oddIdealLucro;
      const ehEmpate = oddA >= oddJusta && !ehLucrativo;

      let classe = 'ev-negativo';
      let badgeClasse = 'badge-neg';
      let statusTexto = '❌ TÁ CARO (-EV)';

      if (ehLucrativo) {
        classe = 'ev-positivo';
        badgeClasse = 'badge-pos';
        statusTexto = '🔥 APOSTA DE VALOR (+EV)';
      } else if (ehEmpate) {
        classe = 'ev-negativo';
        badgeClasse = 'badge-neg';
        statusTexto = '⚠️ ZONA DE EMPATE (SEM VALOR)';
      }

      let explicacao = '';
      if (ehLucrativo) {
        explicacao = `Excelente! A banca te paga <b>${oddA.toFixed(2)}</b>, superando a odd justa (<b>${oddJusta.toFixed(2)}</b>) e a meta de lucro (<b>${oddIdealLucro.toFixed(2)}</b>). Essa entrada tem lucro matemático a longo prazo.`;
      } else if (ehEmpate) {
        explicacao = `A odd <b>${oddA.toFixed(2)}</b> empata com o preço justo (<b>${oddJusta.toFixed(2)}</b>), mas não compensa a variância. Para ter lucro real no bolso, busque odds a partir de <b>${oddIdealLucro.toFixed(2)}</b>.`;
      } else {
        explicacao = `Preço ruim. A banca te paga apenas <b>${oddA.toFixed(2)}</b>. O preço neutro de empate seria <b>${oddJusta.toFixed(2)}</b> e a entrada com lucro real só começa em <b>${oddIdealLucro.toFixed(2)}</b> ou mais.`;
      }

      resDiv.className = `card res-box ${classe}`;
      resDiv.innerHTML = `
        <div class="res-line">
          <span>Taxa da Banca (Juice):</span>
          <span class="res-value" style="color: #FACC15;">${juice.toFixed(2)}%</span>
        </div>
        <div class="res-line">
          <span>Odd Justa (Empate):</span>
          <span class="res-value" style="color: #a1a1aa;">${oddJusta.toFixed(2)}</span>
        </div>
        
        <div class="target-box">
          <div class="target-label">🎯 ENTRADA IDEAL (+EV):</div>
          <div class="target-val">${oddIdealLucro.toFixed(2)}+</div>
        </div>

        <div class="veredito-badge ${badgeClasse}">${statusTexto}</div>
        <p class="explicacao">${explicacao}</p>
      `;

      resDiv.style.display = 'block';
    }
  </script>
</body>
</html>
